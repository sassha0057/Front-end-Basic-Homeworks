<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/registration.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <title>Registration</title>
</head>
<body>
    <div class="login_container">
        <img class="exit_icon" src="./img/exit.svg" alt="exit">
        <h2>
            <p class="login">Login</p>
            <p class="I">I</p>
            <p class="register">Register</p>
        </h2>
        <p class="register_text">Enter your email and password to register.</p>
        <form>
            <input type="text" name="username" placeholder="Username">
            <input type="text" name="email" placeholder="Enter your email address">
            <div class="password">
                <input type="password" name="password" placeholder="Password">
                <img class="eye" src="./img/eye-hide.svg" alt="eye-hide">
            </div>
            <input type="password" name="password" placeholder="Confirm Password">
            <button type="submit">Register</button>
        </form>
        <div class="register_container">
            <div class="line"></div>
            <p class="register_with">Or register with</p>
            <div class="line"></div>
        </div>
        <div class="social_media_container">
            <div class="social_media social_media_google">
                <span><img src="./img/google.svg" alt="google"></span>
                <span class="social_media_description">Continue with Google</span>
            </div>
            <div class="social_media social_media_facebook">
                <span><img src="./img/facebook.svg" alt="facebook"></span>
                <span class="social_media_description">Continue with Facebook</span>
            </div>
        </div>
        <div class="line_"></div>
    </div>
</body>
</html>
