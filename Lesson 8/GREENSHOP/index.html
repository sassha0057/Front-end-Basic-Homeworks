<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./fonts/CeraPro/cerapro.css">
    <title>Home page</title>
</head>
<body>
    <div class="container">
        <header>
            <img src="./img/logo.svg" alt="logo">
            <ul class="list">
                <li class="list-item active">Home</li>
                <li class="list-item">Shop</li>
                <li class="list-item">Plant Care</li>
                <li class="list-item">Blogs</li>
            </ul>
            <button class="login-btn">
                <img src="./img/logout.svg" alt="logout">
                Login
            </button>
        </header>
        <section>
            <div class="main-info">
                <span class="title">Welcome to GreenShop</span>
                <h1>Let’s Make a Better <span class="planet">Planet</span></h1>
                <p class="description">We are an online plant shop offering a wide range of cheap and trendy plants. Use our plants to create an unique Urban Jungle. Order your favorite plants!</p>
                <button class="shop-btn">SHOP NOW</button>
            </div>
            <div class="img-container">
                <img src="./img/big.png" alt="big plant" class="big">
                <img src="./img/little.png" alt="little plant" class="little">
            </div>
        </section>
    </div> 
</body>
</html>
